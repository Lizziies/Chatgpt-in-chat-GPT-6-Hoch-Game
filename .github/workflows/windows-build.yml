name: Godot CI and Windows Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download pinned official Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable"
          curl --fail --location --retry 4 --output /tmp/godot.zip "$BASE/Godot_v4.4.1-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.4.1-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
          /tmp/godot --headless --version

      - name: Import Godot project
        run: /tmp/godot --headless --path . --editor --quit

      - name: Execute logic smoke tests
        run: /tmp/godot --headless --path . --script res://tests/smoke.gd

      - name: Start real 3D game in headless mode
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot --headless --path . --quit-after 30 2>&1 | tee /tmp/void-startup.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/void-startup.log; then
            exit 1
          fi

      - name: Install pinned official Windows export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable"
          curl --fail --location --retry 4 --output /tmp/templates.tpz "$BASE/Godot_v4.4.1-stable_export_templates.tpz"
          mkdir -p /tmp/void-templates
          unzip -q /tmp/templates.tpz 'templates/windows_release_x86_64.exe' 'templates/windows_debug_x86_64.exe' 'templates/version.txt' -d /tmp/void-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp /tmp/void-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Build portable Windows EXE
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          /tmp/godot --headless --path . --export-release "Windows Desktop" "dist/VOID_INDUSTRIES.exe"
          test -s dist/VOID_INDUSTRIES.exe
          ls -lh dist

      - name: Publish Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VOID-INDUSTRIES-Windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14
